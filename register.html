<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Ark-light</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8e3cd;
            background-image: url('https://sun9-22.vkuserphoto.ru/s/v1/ig2/K_oBfgdvayxjVmmpFfViwWDAJhOFWft2M7M9ONHtsn7nTeWcAX0aZ7_apZyjChljh8BMLQmGc9OAJLt76tVqgtYr.jpg?quality=95&as=32x22,48x33,72x50,108x75,160x112,240x168,360x251,480x335,540x377,640x447,720x503,735x513&from=bu&cs=735x0 ');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Cormorant Garamond', Georgia, serif;
            line-height: 1.2;
        backdrop-filter: blur(7px);
        z-index: 0;
        min-height:100vh;
        height:auto;
        margin: 0 auto;
        margin-top: 0;
        padding-top: 0;
        position:relative;
        padding: 0px;
        align-items: flex-end;
        display: flex;
        width: 100%;
        flex-direction: column;
        }
.registration{
border-left: 7px double #f8c585;
display:inline-flex;
width: 20%;
align-items:flex-end;
flex-direction: column;
padding-left: 10px;
margin-left: auto;
margin-right: 50px;
    h1{
            font-family: 'EB Garamond', serif;
            font-weight: 500;
            font-style: italic;
            font-size: 40px;
            letter-spacing: 2px;
            color: #e2dd95dc;
            text-shadow: 1px 1px 3px rgba(92, 71, 1, 0.945);
            margin-bottom: 0px;
            margin-top: 0px;
            padding-top: 30px;
            margin-left: 50px;

    }
    
        .register-box {
            margin-top: 100px;
            align-items: stretch;
            width: 100%;
        }

        .register-input {
            padding: 12px 16px;
            border: 2px solid rgb(182, 105, 12);
            border-radius: 8px;
            background-color: #ffe1b5c4;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 19px;
            font-weight: 800;
            font-style: italic;
            color: rgb(77, 4, 4);
            outline: none;
            align-items: stretch;
            width:100%;
            margin-bottom: 10px;
        }
        .register-input::placeholder {
color: rgba(17, 36, 78, 0.726);
font-weight: 600;
}
        .register-input:focus {
            border-color: #10515a;
        }

        .register-button {
            background-color: #5a4a42;
            color: #fdf6e3;
            border: 2px solid #332d27dc;
            padding: 12px 20px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'EB Garamond', serif;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-left: 40px;
        }

        .register-button:hover {
            background-color: rgba(95, 62, 0, 0.8);
        }

        .message-warning {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-style: italic;
            color: #f5d1a5;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            min-height: 12px;
            margin-top: 10px;
        }
        .back-link {
            color: #f7f1ba;
            text-decoration: underline;
            font-style: italic;
            font-size: 20px;
            margin-left: 50px;
            align-items: center;
            display: flex;
            padding-bottom: 150px;
        }
        .back-link:hover {
            color: #e4ce0b;
    }
}
        body::before {
    content: '';               /* Обязательно, даже если пусто */           /* Слой лежит поверх всего и не прокручивается */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Тёмный полупрозрачный цвет (0.3 = 30% непрозрачности) */
    background-color: rgba(0, 0, 0, 0.3);
    z-index: -1;               /* Отправляем слой под контент, но над фоном body */
    pointer-events: none;      /* Чтобы слой не перехватывал клики */
    padding: 0px;
    margin: 0px;
    position: fixed;
    min-height: 100vh;
}
@media (max-width: 768px) {
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }

    .registration {
        position: relative;
        margin: auto;
        width: 92%;
        max-width: 520px; /* Увеличили ширину, чтобы контейнер не выглядел сжатым */
        padding: 20px 40px 40px 45px; /* Добавили отступы сверху и снизу, увеличили слева для линии */
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        border-left: none; /* Убираем левую границу у самого блока */
        box-sizing: border-box;
    }

    /* Вертикальная линия слева */
    .registration::before {
        content: '';
        position: absolute;
        top: 25px; /* Отступ сверху */
        bottom: 40px; /* Отступ снизу */
        left: 18px;
        width: 7px;
        border-left: 7px double #f8c585; 
        z-index: 1;
    }

    h1 {
        margin: 0 0 25px 0;
        padding: 0;
        text-align: center;
        width: 100%;
        font-size: 42px; /* Увеличили шрифт, чтобы слово Ark-light перешло на вторую строку */
        line-height: 1.1;
        text-shadow: 4px 2px 1px rgba(53, 41, 3, 0.979);
        align-self: flex-start;
    }

    .register-box {
        width: 100%;
        margin-top: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .register-input {
        width: 100%;
        padding: 16px 18px; /* Поля стали выше и объемнее */
        font-size: 20px;
        margin-bottom: 15px;
        border: 2px solid rgb(182, 105, 12);
        border-radius: 8px;
        box-sizing: border-box;
        background-color: #fffaf2;
        outline: none;
        color: rgb(77, 4, 4);
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-weight: 600;
    }

    .register-input::placeholder {
        font-size: 19px;
        color: rgba(17, 36, 78, 0.726);
        font-weight: 600;
    }

    .register-input:focus {
        border-color: #10515a;
    }

    .register-button {
        width: fit-content; /* Кнопка не растягивается на всю ширину */
        margin: 15px 0 0 0;
        padding: 16px 35px; /* Кнопка стала шире */
        font-size: 22px;
        border-radius: 8px;
        cursor: pointer;
        align-self: flex-end; /* Сдвигает кнопку вправо, как на втором фото */
        background-color: #5a4a42;
        color: #fdf6e3;
        border: 2px solid #332d27dc;
        letter-spacing: 1px;
        font-family: 'EB Garamond', serif;
        font-style: italic;
    }

    .register-button:hover {
        background-color: rgba(95, 62, 0, 0.8);
    }

    .message-warning {
        width: 100%;
        text-align: center;
        font-size: 20px;
        margin-top: 15px;
        min-height: 12px;
        color: #f5d1a5;
        font-style: italic;
    }

    .back-link {
        width: auto;
        align-self: flex-start;
        margin-top: 20px;
        margin-left: 0;
        font-size: 20px;
        display: inline-block; /* Позволяет тексту ссылки переноситься на новые строки */
        color: #f7f1ba;
        text-decoration: underline;
        font-style: italic;
        padding-bottom: 30px;
    }
    
    .back-link:hover {
        color: #e4ce0b;
    }
}
    </style>
</head>
<body>
    <div class="registration">
    <h1>Регистрация Ark-light</h1>

    <div class="register-box">
        <input type="text" class="register-input" placeholder="Придумайте логин">
        <input type="password" class="register-input" placeholder="Придумайте пароль">
        <input type="password" class="register-input" placeholder="Повторите пароль">
        <button class="register-button" onclick="register()">Зарегистрироваться</button>
        <p id="registerMessage" class="message-warning"></p>

    <a href="index.html" class="back-link">← Вернуться на Главную страницу</a>
    </div>
</div>
    <script>
        function register() {
            var inputs = document.querySelectorAll('.register-input');
            var login = inputs[0].value;
            var password = inputs[1].value;
            var confirm = inputs[2].value;
            var msgBox = document.getElementById('registerMessage');

            if (login === '' || password === '' || confirm === '') {
                msgBox.textContent = 'Все поля должны быть заполнены.';
                return;
            }
            if (password !== confirm) {
                msgBox.textContent = 'Пароли не совпадают. Проверьте ещё раз.';
                return;
            }
            msgBox.textContent = 'Аккаунт создан! Добро пожаловать в Уютный уголок.';
        }
    </script>
</body>
</html>
